<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <filter id="organicPaper">
    <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="5" result="blobs" />
    
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="grain" />

    <feComposite in="blobs" in2="grain" operator="arithmetic" k1="0" k2="1" k3="0.2" k4="0" result="mixed" />

    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncR type="linear" slope="2" intercept="-0.5" />
      <feFuncG type="linear" slope="2" intercept="-0.5" />
      <feFuncB type="linear" slope="2" intercept="-0.5" />
    </feComponentTransfer>
  </filter>

  <rect width="100%" height="100%" filter="url(#organicPaper)" opacity="0.1" />
</svg>
