<svg viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
  <filter id="reproNoise">
    <feTurbulence 
      type="fractalNoise" 
      baseFrequency="0.85" 
      numOctaves="4" 
      stitchTiles="stitch" 
      result="rawNoise" />
    
    <feColorMatrix 
      in="rawNoise" 
      type="saturate" 
      values="0" 
      result="monoNoise" />
    
    <feComponentTransfer in="monoNoise">
      <feFuncR type="linear" slope="8" intercept="-3.5" />
      <feFuncG type="linear" slope="8" intercept="-3.5" />
      <feFuncB type="linear" slope="8" intercept="-3.5" />
      <feFuncA type="linear" slope="0.5" intercept="0" />
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#reproNoise)" />
</svg>
